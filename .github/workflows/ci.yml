name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · unit tests · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the secret scan
          submodules: recursive # Delegation Framework v1.3.0 for the contracts
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:test
      - name: Contract artifact is up to date (and bytecode reproducible → stable CREATE2 address)
        run: pnpm contracts:build && git diff --exit-code packages/contracts/generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Secret scan (tracked files)
        run: bash scripts/check-secrets.sh --all

  fork:
    name: fork integration · e2e · browser
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    env:
      # Public Base Sepolia RPC; anvil forks it locally. Set a repo variable to use your own endpoint.
      RPC_URL: ${{ vars.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fork
      - run: pnpm poc
      - run: pnpm --filter @cyphos-guard/poc spike:passkey
      - run: pnpm e2e
      - run: pnpm demo:selftest --fake-model
      - run: pnpm e2e:browser
      - run: pnpm e2e:demo
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: apps/approver/e2e/screenshots/
