# Extends gitleaks' default rules. Allowlist ONLY known-public, non-secret values here, each with a reason.
[extend]
useDefault = true

[allowlist]
description = "public contract addresses"
regexes = [
  # Circle test USDC on Base Sepolia (public contract address; appears as `"token": ...` in policies)
  '''0x036CbD53842c5426634e7929541eC2318f3dCF7e''',
]
